# Harrison Whitner

# 6/27/2026 - general settings, status bar and prefix key

# preview of the status bar (black text on a white background)
#
#   [my-session] 0:bash* 1:vim-                        "hostname" 14:12 27-Jun-26

# increase the scrollback buffer size (default is 2000)
set -g history-limit 50000

# enable mouse support (clickable windows, panes, resizable panes)
set -g mouse on

# upgrade terminal colors to 256 color, with true color when the outer terminal supports it
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# make the status bar white with black text
set -g status-style bg=white,fg=black

# expand the left status area to prevent session name truncation (default is 10)
set -g status-left-length 100

# change the prefix key from C-b to C-a so it does not conflict with C-b in vim (page up)
unbind C-b
set -g prefix C-a

# press C-a twice to send a literal C-a to the program running in the pane
bind C-a send-prefix

# 10/29/2026 - on windows (wsl) and over ssh, let tmux send copies to the terminal itself (OSC 52),
# which keeps symbols like ❯ and ↑ intact, unlike clip.exe; macOS terminal.app has no OSC 52 support,
# so copy mouse selections with pbcopy there
if-shell "command -v pbcopy" "set -s copy-command pbcopy"
